name: Validate monorepo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            workers/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('.bun-version', 'bun.lock', 'package.json', 'apps/*/package.json', 'workers/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build apps
        run: bun run build

      - name: Test apps
        run: bun run test

      - name: Check apps and Workers
        run: bun run check
