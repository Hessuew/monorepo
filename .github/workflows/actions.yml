name: Validate monorepo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            workers/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('.bun-version', 'bun.lock', 'package.json', 'apps/*/package.json', 'workers/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build Flame the Freeze
        run: bun run build:flamethefreeze

      - name: Build urFIT-child
        run: bun run build:urfit-child

      - name: Build Cherubim IT
        run: bun run build:cherubim-it

      - name: Test Flame the Freeze
        run: bun run test:flamethefreeze

      - name: Test urFIT-child
        run: bun run test:urfit-child

      - name: Test Cherubim IT
        run: bun run test:cherubim-it

      - name: Check Flame the Freeze
        run: bun run check:flamethefreeze

      - name: Check urFIT-child
        run: bun run check:urfit-child

      - name: Check Cherubim IT
        run: bun run check:cherubim-it

      - name: Check Workers
        run: bun run check:workers
