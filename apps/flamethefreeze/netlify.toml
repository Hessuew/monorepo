[build]
  publish = "apps/flamethefreeze/dist"
  command = "bun run --filter flamethefreeze build"
[build.environment]
  BUN_VERSION = "1.3.10"
  NODE_VERSION = "22.22.3"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
